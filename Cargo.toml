[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
collector-domain = { path = "crates/collector-domain" }
collector-core = { path = "crates/collector-core" }
collector-storage = { path = "crates/collector-storage" }
collector-server = { path = "crates/collector-server" }
collector-connectors = { path = "crates/collector-connectors" }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
utoipa = { version = "5", features = ["axum_extras"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
